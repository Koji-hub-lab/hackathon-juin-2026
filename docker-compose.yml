services:
  postgres:
    image: postgres:16
    container_name: supplychain-postgres
    environment:
      POSTGRES_USER: supplychain
      POSTGRES_PASSWORD: supplychain
      POSTGRES_DB: supplychain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplychain"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: supplychain-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
